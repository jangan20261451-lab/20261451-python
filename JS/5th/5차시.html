<!DOCTYPE html>
<html>
<body>
<h1>Javascript</h1>
<h2>Break</h2>
<h3>The continue statement</h3>

<p>Skip the iteration step when i equals 3.</p>

<p><id="demo"></p>

<script>
let text="";

for (Let i=10; i >= 1; i--){
    if (i ---3) {continue;}
    text += i * 1 + "<br>";
}    

document.getElementById("test").innerHTML= text;
</script>

</body>
</html>
